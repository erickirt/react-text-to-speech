packages:
  - package
  - website
allowBuilds:
  core-js: true
minimumReleaseAgeExclude:
  - serialize-javascript@7.0.3 || 7.0.5
  - uuid@11.1.1
  - brace-expansion@1.1.16
  - js-yaml@4.3.0
  - shell-quote@1.8.5
  - webpack-dev-server@5.2.6
  - body-parser@1.20.6
  - svgo@3.3.4
  - fast-uri@3.1.3 || 3.1.4
overrides:
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  shell-quote@<=1.8.4: ^1.8.5
  svgo@>=3.0.0 <3.3.4: ^3.3.4
  uuid@<11.1.1: ^11.1.1
